name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Verify repository security baseline
        run: python3 scripts/verify_security_baseline.py

      - name: Verify Gradle Wrapper JAR
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK 37
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: Verify Android
        run: >
          ./gradlew --no-daemon --stacktrace
          :android:app:lintDebug
          :android:app:lintRelease
          :android:app:testDebugUnitTest
          :android:app:assembleDebug
          :android:app:assembleRelease
          :android:app:bundleRelease

  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Build amd64
        run: go build ./cmd/kenato-server

      - name: Build arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -o /tmp/kenato-server-arm64 ./cmd/kenato-server

  protocol:
    name: Protocol syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Validate proto
        run: >
          protoc
          --proto_path=protocol
          --descriptor_set_out=/tmp/kenato.pb
          protocol/kenato/v1/envelope.proto
