name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Set up Rust 1.85.0
        run: >
          rustup toolchain install 1.85.0
          --profile minimal
          --component clippy
          --component rustfmt

      - name: Install pinned cargo-audit
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-audit --version 0.22.2 --locked --force
          cargo audit --version

      - name: Audit native Rust dependencies
        run: |
          cargo audit --file native/session-engine/Cargo.lock
          cargo audit --file native/session-jni/Cargo.lock

      - name: Verify native Rust session engine
        working-directory: native/session-engine
        run: |
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 check --locked
          cargo +1.85.0 clippy --locked --all-targets -- -D warnings
          cargo +1.85.0 test --locked
          cargo +1.85.0 build --locked --release
          git diff --exit-code -- Cargo.lock src/lib.rs

      - name: Verify native Android JNI bridge
        working-directory: native/session-jni
        run: |
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 check --locked
          cargo +1.85.0 clippy --locked --all-targets -- -D warnings
          cargo +1.85.0 test --locked
          cargo +1.85.0 build --locked --release
          git diff --exit-code -- Cargo.lock src/lib.rs

      - name: Verify repository security baseline
        run: |
          python3 scripts/verify_security_baseline.py
          python3 scripts/verify_repository_verification.py
          python3 scripts/verify_m5_media_boundary.py
          python3 scripts/test_verify_m5_media_boundary.py

      - name: Verify Gradle Wrapper JAR
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 37 and pinned NDK
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;37.0.0"
          "ndk;28.2.13676358"

      - name: Install pinned Android Rust build tooling
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup target add --toolchain 1.85.0 \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          cargo +1.86.0 install cargo-ndk --version 4.1.2 --locked --force
          test "$(cargo ndk --version)" = "cargo-ndk 4.1.2"

      - name: Build pinned Android JNI libraries
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/build_android_native.sh

      - name: Verify Android
        run: >
          ./gradlew --no-daemon --stacktrace
          :android:app:lintDebug
          :android:app:lintRelease
          :android:app:testDebugUnitTest
          :android:app:assembleDebug
          :android:app:assembleRelease
          :android:app:bundleRelease

      - name: Compile isolated M5 probe instrumentation without changing debug JVM tests
        run: >-
          ./gradlew --no-daemon --stacktrace
          -PkenatoM5ProbeInstrumentation=true
          :android:app:assembleM5Probe
          :android:app:assembleM5ProbeAndroidTest

      - name: Verify separate test-only Keystore APK package IDs and digests
        run: |
          set -euo pipefail
          probe=android/app/build/outputs/apk/m5Probe/app-m5Probe.apk
          tests=android/app/build/outputs/apk/androidTest/m5Probe/app-m5Probe-androidTest.apk
          test -s "$probe"
          test -s "$tests"
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -x "$aapt"
          probe_badging="$("$aapt" dump badging "$probe")"
          tests_badging="$("$aapt" dump badging "$tests")"
          grep -Fq "package: name='com.sl.kenato.m5probe'" <<< "$probe_badging"
          grep -Fq "package: name='com.sl.kenato.m5probe.test'" <<< "$tests_badging"
          mkdir -p "$RUNNER_TEMP/kenato-m5-keystore-probe"
          cp "$probe" "$tests" "$RUNNER_TEMP/kenato-m5-keystore-probe/"
          (
            cd "$RUNNER_TEMP/kenato-m5-keystore-probe"
            sha256sum app-m5Probe.apk app-m5Probe-androidTest.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
            printf 'checked_out_sha=%s\n' "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" > SCOPE.txt
            printf 'pr_head_sha=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" >> SCOPE.txt
            printf 'application_id=com.sl.kenato.m5probe\n' >> SCOPE.txt
            printf 'status=research_only_no_device_pass_no_voice\n' >> SCOPE.txt
            printf 'not_a_release=true\n' >> SCOPE.txt
          )

      - name: Upload temporary isolated M5 Keystore device-test APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kenato-m5-keystore-research-apks
          path: |
            ${{ runner.temp }}/kenato-m5-keystore-probe/app-m5Probe.apk
            ${{ runner.temp }}/kenato-m5-keystore-probe/app-m5Probe-androidTest.apk
            ${{ runner.temp }}/kenato-m5-keystore-probe/SHA256SUMS
            ${{ runner.temp }}/kenato-m5-keystore-probe/SCOPE.txt
          if-no-files-found: error
          retention-days: 14

      - name: Guard Android Java17 bytecode after JDK25 build
        run: python3 scripts/audit_kenato_jvm_target.py android/app/build --max-major 61

  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: Verify Go module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Unformatted Go files:\n%s\n' "$files"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Install govulncheck
        # Immutable upstream revision from 2026-09-08; uses x/tools v0.50.0 with Go 1.27 support.
        run: go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Build amd64
        run: go build ./cmd/kenato-server

      - name: Build arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -o /tmp/kenato-server-arm64 ./cmd/kenato-server

  protocol:
    name: Protocol syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go for protolint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install pinned protolint
        run: go install github.com/yoheimuta/protolint/cmd/protolint@v0.56.4

      - name: Validate protocol
        run: make test-protocol

  repository:
    name: Repository make test
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: Install Go verification tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c
          go install github.com/yoheimuta/protolint/cmd/protolint@v0.56.4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Rust verification toolchains
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-audit --version 0.22.2 --locked --force

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK and native build tooling
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"
          rustup toolchain install 1.86.0 --profile minimal
          rustup target add --toolchain 1.85.0 \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          cargo +1.86.0 install cargo-ndk --version 4.1.2 --locked --force
          test "$(cargo ndk --version)" = "cargo-ndk 4.1.2"

      - name: Run repository-wide make test
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" make test

      - name: Guard Android Java17 bytecode after repository tests
        run: python3 scripts/audit_kenato_jvm_target.py android/app/build --max-major 61
