name: M3 Core Bound Repair Temporary

on:
  push:
    branches:
      - m3/android-session-engine
    paths:
      - .github/workflows/m3-core-bound-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt

      - name: Enforce total unpublished OTK bound
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('native/session-engine/src/lib.rs')
          source = path.read_text()
          old = "    let mut account = load_account(ciphertext, pickle_key)?;\n    let generated = account.generate_one_time_keys(count);\n"
          new = "    let mut account = load_account(ciphertext, pickle_key)?;\n    if account.one_time_keys().len().saturating_add(count) > MAX_ONE_TIME_KEYS_PER_PUBLICATION {\n        return Err(EngineError::InvalidInput(\n            \"total unpublished one-time-key count exceeds the M3 publication bound\",\n        ));\n    }\n    let generated = account.generate_one_time_keys(count);\n"
          if source.count(old) != 1:
              raise SystemExit('expected exactly one generation block')
          source = source.replace(old, new)
          marker = "    #[test]\n    fn outbound_inbound_roundtrip_and_replay_fail_closed() -> Result<(), EngineError> {\n"
          test = "    #[test]\n    fn one_time_key_generation_rejects_total_unpublished_overflow() -> Result<(), EngineError> {\n        let account = create_account()?;\n        let remaining = MAX_ONE_TIME_KEYS_PER_PUBLICATION - INITIAL_ONE_TIME_KEYS;\n        let filled = generate_account_one_time_keys(\n            account.snapshot.ciphertext(),\n            account.snapshot.pickle_key(),\n            remaining,\n        )?;\n        assert_eq!(\n            filled.public.unpublished_one_time_keys.len(),\n            MAX_ONE_TIME_KEYS_PER_PUBLICATION\n        );\n        let overflow = generate_account_one_time_keys(\n            filled.snapshot.ciphertext(),\n            filled.snapshot.pickle_key(),\n            1,\n        );\n        assert!(matches!(overflow, Err(EngineError::InvalidInput(_))));\n        Ok(())\n    }\n\n"
          if source.count(marker) != 1:
              raise SystemExit('expected outbound test marker once')
          path.write_text(source.replace(marker, test + marker))
          PY
          cd native/session-engine
          cargo +1.85.0 fmt --all
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 check --locked
          cargo +1.85.0 clippy --locked --all-targets -- -D warnings
          cargo +1.85.0 test --locked

      - name: Commit exact bound hardening
        run: |
          git diff --check
          git add native/session-engine/src/lib.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M3: bound total unpublished Olm one-time keys'
          git push origin HEAD:m3/android-session-engine
