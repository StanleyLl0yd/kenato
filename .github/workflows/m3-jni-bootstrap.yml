name: M3 JNI Bootstrap Temporary

on:
  push:
    branches:
      - m3/android-session-engine
    paths:
      - .github/workflows/m3-jni-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt

      - name: Generate lock and verify JNI bridge
        working-directory: native/session-jni
        run: |
          cargo +1.85.0 generate-lockfile
          cargo +1.85.0 fmt --all
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 check --locked
          cargo +1.85.0 clippy --locked --all-targets -- -D warnings
          cargo +1.85.0 test --locked
          cargo +1.85.0 build --locked --release

      - name: Commit verified JNI lock and formatting
        run: |
          git diff --check
          git add native/session-jni/Cargo.lock native/session-jni/src/lib.rs
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M3 Android: lock and verify JNI session bridge'
          git push origin HEAD:m3/android-session-engine
