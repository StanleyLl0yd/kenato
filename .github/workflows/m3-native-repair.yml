name: M3 Native Repair Temporary

on:
  push:
    branches:
      - m3/android-session-engine
    paths:
      - .github/workflows/m3-native-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt

      - name: Repair and verify native engine
        working-directory: native/session-engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib.rs')
          source = path.read_text()
          old = 'let ed25519 = *account.ed25519_key().to_bytes();'
          new = 'let ed25519 = *account.ed25519_key().as_bytes();'
          if source.count(old) != 1:
              raise SystemExit('expected exactly one Ed25519 API mismatch')
          path.write_text(source.replace(old, new))
          PY
          cargo +1.85.0 generate-lockfile
          cargo +1.85.0 fmt --all
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 check --locked
          cargo +1.85.0 clippy --locked --all-targets -- -D warnings
          cargo +1.85.0 test --locked
          cargo +1.85.0 build --locked --release

      - name: Commit exact repair
        run: |
          git diff --check
          git add native/session-engine/src/lib.rs native/session-engine/Cargo.lock
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M3: fix vodozemac public-key API and lock native dependencies'
          git push origin HEAD:m3/android-session-engine
