name: M5 WebRTC AGP D8 probe (research only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m5-aar-agp-probe.yml"
      - "scripts/probe_webrtc_agp.py"
      - "scripts/test_probe_webrtc_agp.py"
      - "scripts/collect_webrtc_candidate_evidence.py"
      - "scripts/audit_webrtc_aar.py"
  workflow_dispatch:

permissions: {}

jobs:
  agp-d8-research:
    name: Disposable AGP 9.4 and D8; no device or vendor approval
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Offline probe tests
        run: python3 scripts/test_probe_webrtc_agp.py

      - name: Verify Gradle Wrapper JAR
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 37
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: Probe actual downloaded AARs in disposable applications
        run: >
          python3 scripts/probe_webrtc_agp.py
          --gradlew ./gradlew
          --output /tmp/kenato-m5-agp-d8-evidence.json

      - name: Publish JSON only, never APKs or vendor AARs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m5-agp-d8-evidence
          path: /tmp/kenato-m5-agp-d8-evidence.json
          if-no-files-found: ignore
          retention-days: 7
