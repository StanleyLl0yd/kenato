name: M5 JDK25 Android compatibility (research only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m5-jdk25-compatibility.yml"
      - "docs/development/M5_JDK25_BUILD_PROBE.md"
      - "scripts/audit_kenato_jvm_target.py"
      - "scripts/test_audit_kenato_jvm_target.py"
      - "android/app/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions: {}

jobs:
  android-jdk25:
    name: Full Android build and tests with JDK25 / Java17 target
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify supply-chain and M5 media safety policy
        run: |
          python3 scripts/verify_ci_supply_chain.py
          python3 scripts/verify_security_baseline.py
          python3 scripts/verify_m5_media_boundary.py
          python3 scripts/test_verify_m5_media_boundary.py

      - name: Verify Gradle wrapper JAR
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up Temurin JDK 25 (build runtime only)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Record JDK and Gradle versions
        run: |
          java -version
          ./gradlew --no-daemon --version

      - name: Install pinned Rust toolchains and cargo-ndk
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install 1.86.0 --profile minimal
          rustup target add --toolchain 1.85.0 \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          cargo +1.86.0 install cargo-ndk --version 4.1.2 --locked --force
          test "$(cargo ndk --version)" = "cargo-ndk 4.1.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 37 and pinned NDK
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;37.0.0"
          "ndk;28.2.13676358"

      - name: Build unchanged M3 JNI libraries for production ABI set
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/build_android_native.sh

      - name: Compile, lint, unit-test and package Android with JDK25
        run: >
          ./gradlew --no-daemon --stacktrace
          :android:app:lintDebug
          :android:app:lintRelease
          :android:app:testDebugUnitTest
          :android:app:assembleDebug
          :android:app:assembleRelease
          :android:app:bundleRelease

      - name: Validate bytecode audit negative tests
        run: python3 scripts/test_audit_kenato_jvm_target.py

      - name: Check compiled Kenato JVM classes remain Java17
        run: python3 scripts/audit_kenato_jvm_target.py android/app/build --max-major 61

      - name: Ensure no modifications to checked-out source
        run: git diff --exit-code
