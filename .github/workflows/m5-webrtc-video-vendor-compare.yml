name: M5 ARM64 WebRTC future video vendor comparison (research only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m5-webrtc-video-vendor-compare.yml"
      - "scripts/compare_webrtc_video_vendors.py"
      - "scripts/test_compare_webrtc_video_vendors.py"
      - "scripts/audit_webrtc_aar.py"
      - "scripts/collect_webrtc_candidate_evidence.py"
      - "scripts/probe_webrtc_native_elf.py"
      - "scripts/probe_shiguredo_m157_d8.py"
      - "scripts/probe_shiguredo_m157.py"
  workflow_dispatch:

permissions: {}

jobs:
  compare-full-arm64-video:
    name: Pin both full WebRTC AARs and compile video Java API without JNI
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify supply chain and no production media activation
        run: |
          python3 scripts/verify_ci_supply_chain.py
          python3 scripts/verify_m5_media_boundary.py
      - name: Run offline video comparison regression tests
        run: python3 scripts/test_compare_webrtc_video_vendors.py
      - name: Verify checked-in Gradle wrapper
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Set up JDK25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          verify-signature: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          validate-wrappers: true
      - name: Install Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
      - name: Install SDK37
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Inspect exact SHA-pinned original full AARs and compile separate disposable ARM64 APKs
        run: >
          python3 scripts/compare_webrtc_video_vendors.py
          --gradlew ./gradlew --output /tmp/kenato-m5-video-vendor-compare.json
      - name: Archive bounded JSON evidence only, never publisher AAR or APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m5-arm64-two-vendor-video-compare-json-only
          path: /tmp/kenato-m5-video-vendor-compare.json
          retention-days: 7
          if-no-files-found: ignore
