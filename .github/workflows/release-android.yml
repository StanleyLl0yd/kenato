name: Android release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Gradle Wrapper JAR
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK 37
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: Validate signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/kenato-release.jks"
          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KENATO_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          KENATO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KENATO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KENATO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon --stacktrace
          :android:app:lintRelease
          :android:app:testReleaseUnitTest
          :android:app:assembleRelease
          :android:app:bundleRelease

      - name: Verify signatures
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -type f -print -quit)"
          test -n "$APK"
          test -n "$AAB"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          jarsigner -verify -strict "$AAB"

      - name: Create checksums
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk release/
          cp android/app/build/outputs/bundle/release/*.aab release/
          (
            cd release
            sha256sum *.apk *.aab > SHA256SUMS
          )

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kenato-android-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30
