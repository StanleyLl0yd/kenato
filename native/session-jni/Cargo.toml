[package]
name = "kenato-session-jni"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "=0.21.1", default-features = false }
kenato-session-engine = { path = "../session-engine" }
zeroize = "=1.8.2"

[lints.rust]
# JNI needs stable, unmangled exported symbols. Repository policy separately
# rejects unsafe blocks/functions and any export set outside the reviewed bridge.
unsafe_code = "allow"

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
