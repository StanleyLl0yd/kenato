syntax = "proto3";

package kenato.v1;

option go_package = "github.com/StanleyLl0yd/kenato/protocol/gen/go/kenato/v1;kenatov1";

// Envelope is the minimum server-routable encrypted M4 unit. The sender is
// authenticated by the WSS connection; semantic message type and user content
// remain inside the authenticated M3 ciphertext.
message Envelope {
  uint32 protocol_version = 1;
  bytes recipient = 2;
  bytes message_id = 3;
  bytes ciphertext = 4;
  int64 expires_at_unix_seconds = 5;
  bytes sender = 6;
}
